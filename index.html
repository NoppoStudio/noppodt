        :root {
            --noppo-blue: #0066FF;
            --noppo-bg: #F0F4FF;
        }

            box-sizing: border-box;
        }

            scroll-behavior: smooth;
        }

            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--noppo-bg);
            color: #0F172A;
            letter-spacing: -0.025em;

            background-image:
                radial-gradient(
                    at 0% 0%,
                    rgba(0, 102, 255, 0.08) 0px,
                    transparent 50%
                ),
                radial-gradient(
                    at 100% 100%,
                    rgba(0, 102, 255, 0.08) 0px,
                    transparent 50%
                );
        }

        button,
        input {
            font-family: inherit;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        header {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .n-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 102, 255, 0.05);
            border-radius: 32px;
            transition:
                all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .n-input {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid transparent;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .n-input:focus {
            background: #FFFFFF;
            border-color: var(--noppo-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1);
        }

        .btn-primary {
            background: var(--noppo-blue);
            color: white;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 8px 20px -4px rgba(0, 102, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:disabled {
            background: #CBD5E1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .drop-zone {
            border: 2px dashed rgba(0, 102, 255, 0.2);
            background: rgba(255, 255, 255, 0.2);
            border-radius: 32px;

        }

        .drop-zone.active {

            transform: scale(1.02);
        }

        .drop-zone.disabled {
            opacity: 0.5;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(

                #0066FF,
                #60A5FA

            width: 0%;
            transition: width 0.2s ease-out;
            border-radius: 100px;
        }

        .auth-loading {
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes slideUp {
            from {

                transform: translateY(24px);
            }

                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-up {

                forwards;
        }

        @media (max-width: 640px) {

                border-radius: 26px;
            }
        }
    </style>

    <script>

        /* ======================================================
           CONFIGURATION
        ====================================================== */

        const NOPPO_ID_WORKER =
            "https://noppo-id.noppo5319.workers.dev";

        const NOPPO_ID_FRONTEND =
            "https://id-noppo.pages.dev";

        /*
         * NoppoDT自身のOAuth Redirect URI。
         *
         * 現在のサービスURL:
         * https://dt-noppo.pages.dev/
         *
         * Noppo ID側の /oauth/register に
         * このURIを登録しておく。
         */
        const REDIRECT_URI =
            window.location.origin + window.location.pathname;

        /*
         * PeerJS
         */
        const CHUNK_SIZE = 16384 * 4;

        const PEER_CONFIG = {
            debug: 3,

            config: {
                iceServers: [
                    {
                        urls: "stun:stun.l.google.com:19302"
                    },
                    {
                        urls: "stun:stun1.l.google.com:19302"
                    },
                    {
                        urls: "stun:stun2.l.google.com:19302"
                    },
                    {
                        urls: "stun:stun3.l.google.com:19302"
                    }
                ]
            }
        };


        /* ======================================================
           STATE
        ====================================================== */

        let peer = null;

        let activeConn = null;

        let currentAccount = null;

        let receivingFiles = {};

        let qrScanner = null;

        let currentPeerBaseId = null;

        let peerGeneration = 0;

        let oauthInProgress = false;


        /* ======================================================
           DOM HELPERS
        ====================================================== */

        const $ = id =>
            document.getElementById(id);


        /* ======================================================
           RANDOM / BASE64URL
        ====================================================== */

        function randomBytes(length = 32) {
            const bytes = new Uint8Array(length);

            crypto.getRandomValues(bytes);

            return bytes;
        }


        function bytesToBase64Url(bytes) {

            let binary = "";

            const chunkSize = 0x8000;

            for (
                let i = 0;
                i < bytes.length;
                i += chunkSize
            ) {
                binary += String.fromCharCode(
                    ...bytes.subarray(
                        i,
                        Math.min(
                            i + chunkSize,
                            bytes.length
                        )
                    )
                );
            }

            return btoa(binary)
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/g, "");
        }


        function randomString(length = 32) {
            return bytesToBase64Url(
                randomBytes(length)
            );
        }


        /* ======================================================
           SHA-256
        ====================================================== */

        async function sha256Base64Url(value) {

            const data =
                new TextEncoder().encode(value);

            const digest =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );

            return bytesToBase64Url(
                new Uint8Array(digest)
            );
        }


        /* ======================================================
           PKCE
        ====================================================== */

        async function createPKCE() {

            const codeVerifier =
                randomString(64);

            const codeChallenge =
                await sha256Base64Url(
                    codeVerifier
                );

            return {
                codeVerifier,
                codeChallenge
            };
        }


        /* ======================================================
           OAUTH SESSION STORAGE
        ====================================================== */

        function saveOAuthState(data) {

            sessionStorage.setItem(
                "noppo_dt_oauth",
                JSON.stringify(data)
            );
        }


        function getOAuthState() {

            const raw =
                sessionStorage.getItem(
                    "noppo_dt_oauth"
                );

            if (!raw) return null;

            try {
                return JSON.parse(raw);
            } catch {
                return null;
            }
        }


        function clearOAuthState() {

            sessionStorage.removeItem(
                "noppo_dt_oauth"
            );
        }


        /* ======================================================
           NOPPO ID OAUTH
        ====================================================== */

        async function registerOAuthClient() {

            const response =
                await fetch(
                    `${NOPPO_ID_WORKER}/oauth/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            clientName: "Noppo DT",

                            redirectUris: [
                                REDIRECT_URI
                            ]
                        })
                    }
                );

            let data = null;

            try {
                data = await response.json();
            } catch {
                throw new Error(
                    "Noppo IDのサービス登録応答を読み取れませんでした。"
                );
            }

            if (!response.ok || data.ok === false) {

                throw new Error(
                    data.error ||
                    "Noppo IDへのサービス登録に失敗しました。"
                );
            }

            return data;
        }


        async function startNoppoIDLogin() {

            if (oauthInProgress) return;

            oauthInProgress = true;

            const button = $("auth-btn");

            button.classList.add("auth-loading");

            button.disabled = true;

            button.innerText = "接続中...";

            try {

                /*
                 * OAuth Client登録。
                 *
                 * /oauth/register は冪等なので、
                 * 毎回呼び出しても既存登録なら
                 * alreadyRegistered=true になる。
                 */
                await registerOAuthClient();


                const state =
                    randomString(32);

                const {
                    codeVerifier,
                    codeChallenge
                } = await createPKCE();


                saveOAuthState({
                    state,
                    codeVerifier,
                    createdAt: Date.now()
                });


                const response =
                    await fetch(
                        `${NOPPO_ID_WORKER}/authorize/start`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                redirectUri:
                                    REDIRECT_URI,

                                state,

                                codeChallenge,

                                codeChallengeMethod:
                                    "S256"
                            })
                        }
                    );


                let data = null;

                try {
                    data = await response.json();
                } catch {
                    throw new Error(
                        "Noppo IDの認証開始応答を読み取れませんでした。"
                    );
                }


                if (
                    !response.ok ||
                    data.ok === false
                ) {

                    throw new Error(
                        data.error ||
                        "Noppo IDの認証開始に失敗しました。"
                    );
                }


                if (
                    !data.authorizationSessionId
                ) {

                    throw new Error(
                        "authorizationSessionIdが返されませんでした。"
                    );
                }


                /*
                 * Noppo ID Frontendへ移動。
                 *
                 * Noppo ID側は
                 * authorizationSessionIdを使って
                 * /auth/options → WebAuthn → /auth/verify
                 * を実行する。
                 */
                const url =
                    new URL(
                        NOPPO_ID_FRONTEND
                    );

                url.searchParams.set(
                    "authorizationSessionId",
                    data.authorizationSessionId
                );

                window.location.href =
                    url.toString();

            } catch (error) {

                console.error(
                    "Noppo ID OAuth Error:",
                    error
                );

                clearOAuthState();

                oauthInProgress = false;

                button.classList.remove(
                    "auth-loading"
                );

                button.disabled = false;

                button.innerText =
                    "Noppo IDでログイン";

                alert(
                    error?.message ||
                    "Noppo IDへの接続に失敗しました。"
                );
            }
        }


        /* ======================================================
           OAUTH CALLBACK
        ====================================================== */

        async function handleOAuthCallback() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const code =
                params.get("code");

            const returnedState =
                params.get("state");

            /*
             * code/stateがなければ通常アクセス。
             */
            if (!code && !returnedState) {
                return false;
            }


            if (!code || !returnedState) {

                clearOAuthState();

                cleanupOAuthURL();

                throw new Error(
                    "OAuth callbackが不完全です。"
                );
            }


            const oauthState =
                getOAuthState();

            if (!oauthState) {

                cleanupOAuthURL();

                throw new Error(
                    "OAuth認証情報が見つかりません。"
                );
            }


            /*
             * state検証
             */
            if (
                returnedState !==
                oauthState.state
            ) {

                clearOAuthState();

                cleanupOAuthURL();

                throw new Error(
                    "OAuth stateの検証に失敗しました。"
                );
            }


            /*
             * codeVerifier存在確認
             */
            if (!oauthState.codeVerifier) {

                clearOAuthState();

                cleanupOAuthURL();

                throw new Error(
                    "PKCE codeVerifierが見つかりません。"
                );
            }


            const response =
                await fetch(
                    `${NOPPO_ID_WORKER}/token`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            redirectUri:
                                REDIRECT_URI,

                            code,

                            codeVerifier:
                                oauthState.codeVerifier
                        })
                    }
                );


            let data = null;

            try {
                data = await response.json();
            } catch {
                throw new Error(
                    "Noppo ID Token応答を読み取れませんでした。"
                );
            }


            /*
             * Token交換後は必ず
             * 一時OAuth情報を削除。
             */
            clearOAuthState();

            cleanupOAuthURL();


            if (
                !response.ok ||
                data.ok === false
            ) {

                throw new Error(
                    data.error ||
                    "Noppo IDの認証に失敗しました。"
                );
            }


            if (
                !data.account ||
                !data.account.id ||
                !data.account.username
            ) {

                throw new Error(
                    "Noppo IDから有効なAccount情報を取得できませんでした。"
                );
            }


            currentAccount = {
                id: data.account.id,
                username: data.account.username
            };


            sessionStorage.setItem(
                "noppo_dt_account",
                JSON.stringify(
                    currentAccount
                )
            );


            updateUserUI(
                currentAccount.username,
                true
            );


            /*
             * 認証済みユーザー用Peerを作成。
             */
            await setupPeer(
                currentAccount.username
            );


            return true;
        }


        function cleanupOAuthURL() {

            const cleanURL =
                window.location.origin +
                window.location.pathname;

            window.history.replaceState(
                {},
                document.title,
                cleanURL
            );
        }

        /* ======================================================
           PEER ID
        ====================================================== */

        function sanitizeUsername(username) {

            /*
             * PeerJS IDとして安全なASCIIへ。
             *
             * Noppo ID usernameが日本語などの場合、
             * そのままでは現在のPeer IDルールに
             * 合わない可能性があるため、
             * ASCII部分だけを利用する。
             */
            return String(username || "")
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9-]/g, "")
                .replace(/^-+|-+$/g, "")
                .slice(0, 48);
        }


        function makeBasePeerId(username) {

            const safe =
                sanitizeUsername(username);

            if (!safe) {

                return null;
            }

            return `noppo-${safe}`;
        }


        function createGuestPeerId() {

            return null;
        }


        /* ======================================================
           PEER SETUP
        ====================================================== */

        async function setupPeer(
            username,
            suffix = ""
        ) {

            const generation =
                ++peerGeneration;


            /*
             * 古いPeerを破棄。
             */
            if (peer) {

                try {
                    peer.destroy();
                } catch {}

                peer = null;
            }


            /*
             * 現在接続中のConnectionも破棄。
             */
            if (activeConn) {

                try {
                    activeConn.close();
                } catch {}

                activeConn = null;
            }


            currentPeerBaseId =
                makeBasePeerId(username);


            let requestedId =
                currentPeerBaseId;

            if (requestedId) {

                requestedId += suffix;
            }


            updateConnStatus(
                "Initializing",
                false
            );


            $("my-peer-id").innerText =
                "Initializing...";


            /*
             * Guestの場合、
             * PeerJSにnullを渡してランダムIDを生成。
             */
            peer =
                new Peer(
                    requestedId,
                    PEER_CONFIG
                );


            /*
             * PeerJS OPEN
             */
            peer.on(
                "open",
                id => {

                    if (
                        generation !==
                        peerGeneration
                    ) {
                        return;
                    }


                    $("my-peer-id").innerText =
                        id;

                    generateQR(id);

                    updateConnStatus(
                        "Ready",
                        false
                    );

                    console.log(
                        "Peer ID:",
                        id
                    );

                    console.log(
                        "Peer Mode:",
                        currentPeerBaseId
                            ? "Noppo ID"
                            : "Guest"
                    );
                }
            );


            /*
             * Incoming connection
             */
            peer.on(
                "connection",
                conn => {

                    if (
                        generation !==
                        peerGeneration
                    ) {

                        try {
                            conn.close();
                        } catch {}

                        return;
                    }

                    console.log(
                        "Incoming connection from:",
                        conn.peer
                    );

                    /*
                     * 既存接続があれば閉じる。
                     */
                    if (
                        activeConn &&
                        activeConn.open
                    ) {

                        try {
                            activeConn.close();
                        } catch {}
                    }

                    activeConn = conn;

                    handleConnection(
                        conn
                    );
                }
            );


            /*
             * PeerJS error
             */
            peer.on(
                "error",
                err => {

                    if (
                        generation !==
                        peerGeneration
                    ) {
                        return;
                    }


                    console.error(
                        "PeerJS Error Type:",
                        err.type
                    );

                    console.error(
                        "Full Error Object:",
                        err
                    );


                    /*
                     * ID衝突。
                     *
                     * Noppo IDユーザーなら
                     * noppo-username-XXXX
                     */
                    if (
                        err.type ===
                        "unavailable-id"
                    ) {

                        if (
                            currentPeerBaseId
                        ) {

                            const randomSuffix =
                                "-" +
                                Math.floor(
                                    Math.random() *
                                    9000
                                ) +
                                1000;

                            setupPeer(
                                username,
                                randomSuffix
                            );

                        } else {

                            /*
                             * Guestでこのエラーが出ることは
                             * 基本的にはないが、
                             * 念のため再生成。
                             */
                            setupPeer(
                                null
                            );
                        }

                        return;
                    }


                    if (
                        err.type ===
                        "peer-unavailable"
                    ) {

                        alert(
                            "相手のデバイスが見つかりません。IDが正しいか確認してください。"
                        );

                        updateConnStatus(
                            "Not Found",
                            false
                        );

                        return;
                    }


                    if (
                        err.type ===
                        "network"
                    ) {

                        alert(
                            "ネットワークに問題があるか、Firewallにブロックされています。"
                        );

                        updateConnStatus(
                            "Network Error",
                            false
                        );

                        return;
                    }


                    if (
                        err.type ===
                        "server-error"
                    ) {

                        updateConnStatus(
                            "Server Error",
                            false
                        );

                        return;
                    }
                }
            );


            peer.on(
                "disconnected",
                () => {

                    if (
                        generation !==
                        peerGeneration
                    ) {
                        return;
                    }

                    console.warn(
                        "PeerJS disconnected from signaling server."
                    );

                    updateConnStatus(
                        "Reconnecting",
                        false
                    );

                    /*
                     * PeerJS自身のreconnect。
                     */
                    try {
                        peer.reconnect();
                    } catch {}
                }
            );
        }


        /* ======================================================
           CONNECT
        ====================================================== */

        function startConnect() {

            const target =
                $("target-id")
                    .value
                    .trim();


            if (!target) {

                alert(
                    "相手のIDを入力してください。"
                );

                return;
            }


            if (
                !peer ||
                !peer.open
            ) {

                alert(
                    "Peerの初期化が完了していません。"
                );

                return;
            }


            /*
             * 自分自身への接続防止。
             */
            if (
                target ===
                $("my-peer-id").innerText
            ) {

                alert(
                    "自分自身のIDには接続できません。"
                );

                return;
            }


            /*
             * 既存接続を閉じる。
             */
            if (
                activeConn &&
                activeConn.open
            ) {

                try {
                    activeConn.close();
                } catch {}
            }


            console.log(
                "Attempting to connect to:",
                target
            );


            updateConnStatus(
                "Connecting",
                true
            );


            const conn =
                peer.connect(
                    target,
                    {
                        reliable: true
                    }
                );


            activeConn = conn;

            handleConnection(
                conn
            );
        }


        /* ======================================================
           CONNECTION HANDLER
        ====================================================== */

        function handleConnection(conn) {

            conn.on(
                "open",
                () => {

                    console.log(
                        "Connection established with:",
                        conn.peer
                    );

                    updateConnStatus(
                        "Linked",
                        true
                    );

                    enableTransferUI(
                        true
                    );
                }
            );


            conn.on(
                "data",
                data => {

                    if (
                        !data ||
                        typeof data !==
                        "object"
                    ) {
                        return;
                    }


                    /*
                     * FILE START
                     */
                    if (
                        data.type ===
                        "file-start"
                    ) {

                        receivingFiles[
                            data.fileId
                        ] = {

                            chunks: [],

                            total:
                                data.totalChunks,

                            received: 0,

                            name:
                                data.name,

                            mime:
                                data.mime ||
                                "application/octet-stream"
                        };


                        addProgressUI(
                            data.fileId,
                            data.name,
                            "receiving"
                        );

                        return;
                    }


                    /*
                     * FILE CHUNK
                     */
                    if (
                        data.type ===
                        "file-chunk"
                    ) {

                        const info =
                            receivingFiles[
                                data.fileId
                            ];


                        if (!info) {
                            return;
                        }


                        info.chunks[
                            data.index
                        ] = data.chunk;


                        info.received++;


                        if (
                            info.received % 5 === 0 ||
                            info.received ===
                            info.total
                        ) {

                            const pct =
                                Math.floor(
                                    (
                                        info.received /
                                        info.total
                                    ) * 100
                                );


                            updateProgressUI(
                                data.fileId,
                                pct,
                                `${pct}%`
                            );
                        }


                        if (
                            info.received ===
                            info.total
                        ) {

                            finalizeDownload(
                                data.fileId
                            );
                        }
                    }
                }
            );


            conn.on(
                "close",
                () => {

                    console.log(
                        "Connection closed"
                    );

                    updateConnStatus(
                        "Disconnected",
                        false
                    );

                    enableTransferUI(
                        false
                    );

                    if (
                        activeConn ===
                        conn
                    ) {

                        activeConn =
                            null;
                    }
                }
            );


            conn.on(
                "error",
                err => {

                    console.error(
                        "Connection Error:",
                        err
                    );

                    updateConnStatus(
                        "Error",
                        false
                    );

                    enableTransferUI(
                        false
                    );
                }
            );
        }

        /* ======================================================
           FILE SENDING
        ====================================================== */

        async function sendFiles(files) {

            if (
                !files ||
                !files.length
            ) {
                return;
            }


            if (
                !activeConn ||
                !activeConn.open
            ) {

                alert(
                    "デバイスが接続されていません。"
                );

                return;
            }


            for (
                const file of files
            ) {

                if (
                    !activeConn ||
                    !activeConn.open
                ) {

                    break;
                }


                const fileId =
                    "f" +
                    randomString(9);


                const totalChunks =
                    Math.ceil(
                        file.size /
                        CHUNK_SIZE
                    );


                addProgressUI(
                    fileId,
                    file.name,
                    "sending"
                );


                /*
                 * Zero-byte fileの場合、
                 * totalChunksが0になるため
                 * 1つの空チャンクとして送る。
                 */
                const actualTotalChunks =
                    Math.max(
                        1,
                        totalChunks
                    );


                activeConn.send({

                    type:
                        "file-start",

                    fileId,

                    name:
                        file.name,

                    mime:
                        file.type ||
                        "application/octet-stream",

                    totalChunks:
                        actualTotalChunks
                });


                /*
                 * 空ファイル
                 */
                if (
                    file.size === 0
                ) {

                    activeConn.send({

                        type:
                            "file-chunk",

                        fileId,

                        index: 0,

                        chunk:
                            new ArrayBuffer(0)
                    });

                    updateProgressUI(
                        fileId,
                        100,
                        "Done"
                    );

                    continue;
                }


                for (
                    let i = 0;
                    i < totalChunks;
                    i++
                ) {

                    /*
                     * Backpressure制御。
                     */
                    while (
                        activeConn &&
                        activeConn.open &&
                        activeConn.bufferSize >
                        CHUNK_SIZE * 20
                    ) {

                        await new Promise(
                            resolve =>
                                setTimeout(
                                    resolve,
                                    50
                                )
                        );
                    }


                    if (
                        !activeConn ||
                        !activeConn.open
                    ) {

                        break;
                    }


                    const chunk =
                        await file
                            .slice(
                                i * CHUNK_SIZE,
                                (i + 1) *
                                    CHUNK_SIZE
                            )
                            .arrayBuffer();


                    activeConn.send({

                        type:
                            "file-chunk",

                        fileId,

                        index: i,

                        chunk
                    });


                    if (
                        i % 10 === 0 ||
                        i ===
                        totalChunks - 1
                    ) {

                        const pct =
                            Math.floor(
                                (
                                    (i + 1) /
                                    totalChunks
                                ) * 100
                            );


                        updateProgressUI(
                            fileId,
                            pct,
                            `${pct}%`
                        );
                    }
                }


                if (
                    activeConn &&
                    activeConn.open
                ) {

                    updateProgressUI(
                        fileId,
                        100,
                        "Done"
                    );
                }
            }


            /*
             * 同じファイルを再度選択できるようにする。
             */
            $("file-input").value = "";
        }


        /* ======================================================
           DOWNLOAD
        ====================================================== */

        function finalizeDownload(
            fileId
        ) {

            const info =
                receivingFiles[fileId];


            if (!info) {
                return;
            }


            try {

                const blob =
                    new Blob(
                        info.chunks,
                        {
                            type:
                                info.mime
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    url;

                a.download =
                    info.name;


                document.body.appendChild(
                    a
                );

                a.click();

                a.remove();


                setTimeout(
                    () => {
                        URL.revokeObjectURL(
                            url
                        );
                    },
                    10000
                );


                updateProgressUI(
                    fileId,
                    100,
                    "Saved"
                );


                delete receivingFiles[
                    fileId
                ];

            } catch (error) {

                console.error(
                    "Download error:",
                    error
                );

                updateProgressUI(
                    fileId,
                    100,
                    "Error"
                );

                alert(
                    "ファイルの保存に失敗しました。"
                );
            }
        }

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        function updateProgressUI(
            id,
            pct,
            text
        ) {

            const safeId =
                String(id);


            const bar =
                document.getElementById(
                    `${safeId}-bar`
                );


            const stat =
                document.getElementById(
                    `${safeId}-stat`
                );


            if (bar) {

                bar.style.width =
                    `${Math.max(
                        0,
                        Math.min(
                            100,
                            pct
                        )
                    )}%`;
            }


            if (stat) {
                stat.innerText =
                    text;
            }
        }


        /* ======================================================
           QR
        ====================================================== */

        function generateQR(text) {

            const el =
                $("qrcode");


            el.innerHTML = "";


            if (!text) {
                return;
            }


            new QRCode(
                el,
                {
                    text,

                    width: 200,

                    height: 200,

                    colorDark:
                        "#0f172a",

                    colorLight:
                        "#ffffff",

                    correctLevel:
                        QRCode.CorrectLevel.M
                }
            );
        }


        function showQR() {

            const id =
                $("my-peer-id")
                    .innerText
                    .trim();


            if (
                !id ||
                id ===
                "Initializing..."
            ) {

                return;
            }


            $("modal-qr")
                .classList
                .replace(
                    "hidden",
                    "flex"
                );
        }


        function closeModal(id) {

            $(id)
                .classList
                .replace(
                    "flex",
                    "hidden"
                );
        }


        async function copyId() {

            const id =
                $("my-peer-id")
                    .innerText
                    .trim();


            if (
                !id ||
                id ===
                "Initializing..."
            ) {
                return;
            }


            try {

                await navigator
                    .clipboard
                    .writeText(id);

            } catch {

                /*
                 * Clipboard APIが使えない場合の
                 * fallback。
                 */
                const textarea =
                    document.createElement(
                        "textarea"
                    );

                textarea.value =
                    id;

                textarea.style.position =
                    "fixed";

                textarea.style.opacity =
                    "0";

                document.body.appendChild(
                    textarea
                );

                textarea.select();

                document.execCommand(
                    "copy"
                );

                textarea.remove();
            }
        }


        /* ======================================================
           CLEAR LOGS
        ====================================================== */

        function clearLogs() {

            const list =
                $("transfer-list");


            list.innerHTML = `
                <div
                    id="empty-hint"
                    class="py-20 text-center border-2 border-dashed border-white/50 rounded-[40px] bg-white/20"
                >
                    <p class="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">
                        No active transfers
                    </p>
                </div>
            `;
        }


        /* ======================================================
           QR SCANNER
        ====================================================== */

        async function openScan() {

            $("modal-scan")
                .classList
                .replace(
                    "hidden",
                    "flex"
                );


            try {

                qrScanner =
                    new Html5Qrcode(
                        "reader"
                    );


                await qrScanner.start(

                    {
                        facingMode:
                            "environment"
                    },

                    {
                        fps: 24,

                        qrbox: 250
                    },

                    text => {

                        $("target-id")
                            .value =
                            text;

                        closeScan();

                        /*
                         * 少し待ってから接続。
                         */
                        setTimeout(
                            () => {
                                startConnect();
                            },
                            100
                        );
                    },

                    () => {
                        /*
                         * QRが見つからないフレームの
                         *エラーは無視。
                         */
                    }
                );

            } catch (error) {

                console.error(
                    "QR scanner error:",
                    error
                );

                closeScan();

                alert(
                    "カメラを起動できませんでした。カメラの使用許可を確認してください。"
                );
            }
        }


        async function closeScan() {

            if (qrScanner) {

                const scanner =
                    qrScanner;

                qrScanner =
                    null;

                try {

                    if (
                        scanner.isScanning
                    ) {

                        await scanner.stop();
                    }

                } catch (error) {

                    console.warn(
                        "QR scanner stop:",
                        error
                    );
                }


                try {
                    await scanner.clear();
                } catch {}
            }


            $("modal-scan")
                .classList
                .replace(
                    "flex",
                    "hidden"
                );
        }


        /* ======================================================
           DRAG & DROP
        ====================================================== */

        const dz =
            $("drop-zone");


        dz.ondragover = event => {

            event.preventDefault();

            if (
                activeConn &&
                activeConn.open
            ) {

                dz.classList.add(
                    "active"
                );
            }
        };


        dz.ondragleave = () => {

            dz.classList.remove(
                "active"
            );
        };


        dz.ondrop = event => {

            event.preventDefault();

            dz.classList.remove(
                "active"
            );


            if (
                activeConn &&
                activeConn.open
            ) {

                sendFiles(
                    event
                        .dataTransfer
                        .files
                );
            }
        };


        $("file-input").onchange =
            event => {

                sendFiles(
                    event.target.files
                );
            };


        /* ======================================================
           KEYBOARD
        ====================================================== */

        $("target-id").addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    startConnect();
                }
            }
        );


        /* ======================================================
           INITIALIZATION
        ====================================================== */

        async function initialize() {

            updateUserUI(
                "Guest",
                false
            );


            /*
             * OAuth callbackを先に処理。
             */
            try {

                const handled =
                    await handleOAuthCallback();


                if (handled) {

                    console.log(
                        "Noppo ID OAuth callback completed."
                    );

                    return;
                }

            } catch (error) {

                console.error(
                    "OAuth callback error:",
                    error
                );

                alert(
                    error?.message ||
                    "Noppo IDログインに失敗しました。"
                );

                /*
                 * OAuth失敗時でもGuestとして
                 * NoppoDTを利用できるようにする。
                 */
            }


            /*
             * 現在のタブにNoppo IDセッションが
             *残っている場合は復元。
             */
            currentAccount =
                restoreSession();


            if (currentAccount) {

                updateUserUI(
                    currentAccount.username,
                    true
                );

                await setupPeer(
                    currentAccount.username
                );

            } else {

                /*
                 * Guest Peer。
                 */
                updateUserUI(
                    "Guest",
                    false
                );

                await setupPeer(
                    null
                );
            }
        }


        /*
         * ページ起動
         */
        window.addEventListener(
            "load",
            initialize
        );

    </script>

</body>
</html>
